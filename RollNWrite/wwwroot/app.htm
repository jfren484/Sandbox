<!DOCTYPE html>
<html>
	<head>
		<title>Roll &amp; Write</title>
		<meta charset="utf-8">
		<link rel="stylesheet" href="./css/app.css">
		<link rel="stylesheet" href="./css/dialog.css">
	</head>

	<body>
		<div>
			<div id="toolbar" class="toolbar">
				<button type="button" class="toolbarButton" id="btnSave" title="Save current game state">Save</button>
				<button type="button" class="toolbarButton" id="btnLoad" title="Load saved game state">Load</button>

				<div class="toolbarDivider"></div>

				<button type="button" class="toolbarButton" id="btnUndo" title="Undo last action">Undo</button>
				<button type="button" class="toolbarButton" id="btnRedo" title="Redo last action">Redo</button>

				<div class="toolbarDivider"></div>

				<button type="button" class="toolbarButton" id="btnConfig" title="Edit current game settings (background image and tools)">
					<span style="font-size: 2.5em; font-weight: bold; position: relative; bottom: 0.2em;">&#9881;</span>
				</button>

				<div class="toolbarDivider"></div>

				<div id="toolbarCustomButtons" class="toolbarCustomButtons"></div>
			</div>
			<div id="canvasCont" class="canvasContainer">
				<canvas id="bgCanvas"></canvas>
				<canvas id="gameCanvas"></canvas>
			</div>
		</div>
		<div style="display: none">
			<input type="file" id="fileInput" />
		</div>
		<div id="modalDialog" class="modal modalDialog">
			<div class="mainDialog">
				<div class="dialogHeader">
					<span></span>
					<div class="dialogHeaderTitle">Game Settings</div>
					<button type="button" id="btnDialogCancel">X</button>
				</div>
				<div class="dialogContentSection dialogContentSectionImage">
					<div class="dialogContentImage">
						<div class="dialogContentHeader">Game Image</div>
						<img id="imgBG" src="./img/bgph.png" />
						<button type="button" class="toolbarButton" id="btnBGImage">Choose Background Image</button>
					</div>
					<div class="modal modalSection hideOnFormChanges"></div>
				</div>
				<div class="dialogContentSection dialogContentSectionToolList">
					<div class="dialogContentTools">
						<div class="dialogContentHeader">Tools</div>
						<div id="dialogToolsList"></div>
						<button type="button" class="toolbarButton" id="btnDialogToolAdd" style="font-size: 1.5em">&#10010;</button>
					</div>
					<div class="modal modalSection hideOnFormChanges"></div>
				</div>
				<div class="dialogContentSection dialogContentSectionToolPosition">
					<div class="dialogContentToolDefManage">
						<div class="dialogContentHeader">Tool Position</div>
						<div class="dialogContentToolSpecific">
							<button type="button" id="btnDialogToolMoveUp">Move Up</button>
							<button type="button" id="btnDialogToolDelete">Delete</button>
							<button type="button" id="btnDialogToolMoveDown">Move Down</button>
						</div>
					</div>
					<div class="modal modalSection modalSectionTool"></div>
				</div>
				<div class="dialogContentSection dialogContentSectionToolDefinition">
					<div class="dialogContentToolDef">
						<div class="dialogContentHeader">Tool Definition</div>
						<form id="toolEditForm" class="dialogContentToolSpecific">
							<label for="dialogToolType">
								Tool Type:
								<select id="dialogToolType">
									<option></option>
									<option value="line">Line Drawing</option>
									<option value="circ">Circle</option>
									<option value="rect">Rectangle</option>
									<option value="text">Static Text</option>
									<option value="dyntext">Dynamic Text</option>
									<option value="erase">Erase</option>
									<option value="rng">Random / Die</option>
								</select>
							</label>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_line">
								<div><label>Size: <input type="number" name="lineWidth" min="1" value="2" /></label></div>
								<div><label>Color: <input type="text" name="strokeColor" value="black" /></label></div>
							</div>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_circ">
								<div><label>Diameter: <input type="number" name="diameter" min="1" value="10" /></label></div>
								<div><label>Outline Width: <input type="number" name="strokeWidth" min="1" value="2" /></label></div>
								<div><label>Outline Color: <input type="text" name="strokeColor" value="transparant" /></label></div>
								<div><label>Fill Color: <input type="text" name="fillColor" value="transparent" /></label></div>
							</div>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_rect">
								<div><label>Width: <input type="number" name="width" min="1" value="10" /></label></div>
								<div><label>Height: <input type="number" name="height" min="1" value="10" /></label></div>
								<div><label>Outline Width: <input type="number" name="strokeWidth" min="1" value="2" /></label></div>
								<div><label>Outline Color: <input type="text" name="strokeColor" value="transparant" /></label></div>
								<div><label>Fill Color: <input type="text" name="fillColor" value="transparent" /></label></div>
							</div>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_text">
								<div><label>Text: <input type="text" name="textValue" value="" /></label></div>
								<div><label>Font Size (px): <input type="number" name="fontSize" min="1" value="15" /></label></div>
								<div><label>Bold: <input type="checkbox" name="isBold" /></label></div>
								<div><label>Color: <input type="text" name="fillColor" value="black" /></label></div>
							</div>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_dyntext">
								<div><label>Font Size (px): <input type="number" name="fontSize" min="1" value="15" /></label></div>
								<div><label>Bold: <input type="checkbox" name="isBold" /></label></div>
								<div><label>Color: <input type="text" name="fillColor" value="black" /></label></div>
							</div>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_erase">
								<div><label>Size: <input type="number" name="lineWidth" min="1" value="10" /></label></div>
							</div>
							<div class="dialogToolTypeCont" id="dialogToolTypeCont_rng">
								<div><label>Faces: <input type="number" name="faceCount" min="1" value="6" /></label></div>
							</div>
							<div>
								<button type="button" id="btnDialogToolCancel">Cancel</button>
								<button type="button" id="btnDialogToolSave">Save</button>
							</div>
						</form>
					</div>
					<div class="modal modalSection modalSectionTool"></div>
				</div>
				<div class="dialogFooter">
					<button type="button" id="btnDialogSave">Save</button>
				</div>
			</div>
		</div>
		<script type="text/javascript" src="./js/mainDialog.js"></script>
		<script type="text/javascript" src="./js/eventHandlers.js"></script>
		<script type="text/javascript" src="./js/drawing.js"></script>
		<script type="text/javascript" src="./js/dragdrop.js"></script>
		<script type="text/javascript" src="./js/toolConfig.js"></script>
		<script type="text/javascript" src="./js/app.js"></script>
	</body>
</html>
